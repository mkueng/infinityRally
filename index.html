<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Infinity Rally</title>
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
    }

    body.double-player::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-1px);
      background: rgba(255,255,255,0.42);
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      z-index: 9;
      pointer-events: none;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 18, 0.54);
      font-family: Arial, sans-serif;
      color: white;
    }

    .start-panel {
      width: min(420px, calc(100vw - 36px));
      padding: 28px;
      background: rgba(18, 25, 28, 0.78);
      box-shadow: 0 18px 50px rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .start-title {
      margin: 0 0 22px;
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .start-actions {
      display: grid;
      gap: 12px;
    }

    .start-actions button {
      height: 52px;
      border: 0;
      background: #d6b25a;
      color: #1c211f;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
    }

    .start-actions button:hover {
      background: #efcf72;
    }
  </style>
</head>
<body>
<div id="startScreen" class="start-screen">
  <div class="start-panel">
    <h1 class="start-title">Infinity Rally</h1>
    <div class="start-actions">
      <button type="button" data-mode="single">Single Player</button>
      <button type="button" data-mode="double">Double Player</button>
    </div>
  </div>
</div>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
    }
  }
</script>
<script type="module" src="./src/main.js?v=alien-planet-world"></script>
</body>
</html>
