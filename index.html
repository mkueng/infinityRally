<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SOL 8</title>
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
    }

    * {
      cursor: none !important;
    }

    body.double-player::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-1px);
      background: rgba(255,255,255,0.42);
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      z-index: 9;
      pointer-events: none;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 18, 0.54);
      font-family: Arial, sans-serif;
      color: white;
    }

    .start-panel {
      width: min(420px, calc(100vw - 36px));
      padding: 28px;
      background: rgba(18, 25, 28, 0.78);
      box-shadow: 0 18px 50px rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .start-title {
      margin: 0 0 22px;
      font-family: "Orbitron", "Eurostile", "Bank Gothic", "Rajdhani", "Arial Black", Arial, sans-serif;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      color: #e8f8ff;
      text-shadow: 0 0 10px rgba(103,244,255,0.44), 0 2px 0 rgba(0,0,0,0.5);
    }

    .start-actions {
      display: grid;
      gap: 12px;
    }

    .start-actions button {
      height: 52px;
      border: 0;
      background: #d6b25a;
      color: #1c211f;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
      cursor: pointer;
    }

    .start-actions button:hover {
      background: #efcf72;
    }

    .menu-robot-cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 34px;
      height: 42px;
      z-index: 45;
      pointer-events: none;
      transform: translate3d(calc(50vw - 17px), calc(50vh - 21px), 0);
      filter: drop-shadow(0 7px 10px rgba(0,0,0,0.38));
      transition: filter 120ms ease;
    }

    .menu-robot-cursor .robot-head,
    .menu-robot-cursor .robot-body,
    .menu-robot-cursor .robot-arm,
    .menu-robot-cursor .robot-leg {
      position: absolute;
      background: #9aa7ad;
      border: 2px solid #222a2d;
      box-sizing: border-box;
    }

    .menu-robot-cursor .robot-head {
      left: 7px;
      top: 0;
      width: 20px;
      height: 16px;
      background: #b8c3c7;
    }

    .menu-robot-cursor .robot-eye {
      position: absolute;
      top: 5px;
      width: 4px;
      height: 4px;
      background: #67f4ff;
      box-shadow: 0 0 7px rgba(103,244,255,0.9);
    }

    .menu-robot-cursor .robot-eye.left {
      left: 5px;
    }

    .menu-robot-cursor .robot-eye.right {
      right: 5px;
    }

    .menu-robot-cursor .robot-body {
      left: 5px;
      top: 16px;
      width: 24px;
      height: 18px;
      background: #69777c;
    }

    .menu-robot-cursor .robot-body::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 5px;
      width: 5px;
      height: 5px;
      background: #d6b25a;
      box-shadow: 0 0 7px rgba(214,178,90,0.85);
    }

    .menu-robot-cursor .robot-arm {
      top: 19px;
      width: 7px;
      height: 15px;
      background: #495357;
      transform-origin: 50% 2px;
    }

    .menu-robot-cursor .robot-arm.left {
      left: 0;
      transform: rotate(18deg);
    }

    .menu-robot-cursor .robot-arm.right {
      right: 0;
      transform: rotate(-32deg);
      background: #d6b25a;
    }

    .menu-robot-cursor .robot-leg {
      top: 32px;
      width: 8px;
      height: 10px;
      background: #343c3f;
    }

    .menu-robot-cursor .robot-leg.left {
      left: 8px;
    }

    .menu-robot-cursor .robot-leg.right {
      right: 8px;
    }

    .menu-robot-cursor.is-pressing {
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.44)) brightness(1.16);
    }

    .menu-robot-cursor.is-pressing .robot-arm.right {
      transform: rotate(-58deg);
    }
  </style>
</head>
<body>
<div id="startScreen" class="start-screen">
  <div class="start-panel">
    <h1 class="start-title">SOL 8</h1>
    <div class="start-actions">
      <button type="button" data-mode="single">Single Player</button>
      <button type="button" data-mode="double">Double Player</button>
    </div>
  </div>
  <div id="menuRobotCursor" class="menu-robot-cursor" aria-hidden="true">
    <div class="robot-head">
      <span class="robot-eye left"></span>
      <span class="robot-eye right"></span>
    </div>
    <div class="robot-body"></div>
    <div class="robot-arm left"></div>
    <div class="robot-arm right"></div>
    <div class="robot-leg left"></div>
    <div class="robot-leg right"></div>
  </div>
</div>
<script>
  (() => {
    const cursor = document.getElementById("menuRobotCursor");
    const startScreen = document.getElementById("startScreen");
    if (!cursor || !startScreen) return;

    function menuVisible() {
      return startScreen.style.display !== "none";
    }

    window.addEventListener("pointermove", event => {
      if (!menuVisible()) return;
      cursor.style.transform = `translate3d(${event.clientX - 17}px, ${event.clientY - 21}px, 0)`;
    });

    window.addEventListener("pointerdown", () => {
      if (menuVisible()) cursor.classList.add("is-pressing");
    });

    window.addEventListener("pointerup", () => {
      cursor.classList.remove("is-pressing");
    });
  })();
</script>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
    }
  }
</script>
<script type="module" src="./src/main.js?v=alien-planet-world"></script>
</body>
</html>
